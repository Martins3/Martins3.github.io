name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2

      - name: Install CJK fonts
        shell: bash
        run: |
          set -E -e -u -o pipefail
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Build mathematics PDFs
        shell: bash
        run: |
          set -E -e -u -o pipefail
          find docs/math -type f -name '*.typ' -print0 \
          	| while IFS= read -r -d '' typ_file; do
          		typst compile --root . "$typ_file"
          	done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build learning tutorials
        shell: bash
        run: node docs/learning/build.cjs --publish

      - name: Build the Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
