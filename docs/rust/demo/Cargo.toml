[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"

[workspace]
members = [".", "concurrent", "grpc", "pingora", "rustbook"]
default-members = [".", "concurrent", "grpc", "pingora", "rustbook"]
resolver = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
ptr_as_ptr = "warn"
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
exit = "warn"
tests_outside_test_module = "warn"
assertions_on_result_states = "warn"
error_impl_error = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
strip = "none"

[profile.bench]
strip = "debuginfo"
