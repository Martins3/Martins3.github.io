# Serial-only example for an existing Collei VM.
# Add these keys to that VM's config.ini [vm] section.

[vm]

# Each line is "frontend backend". Names, paths, guest port names and logs
# are generated from the frontend and its position.
# Frontends can repeat and are numbered independently in declaration order.
# serial selects hardware ports: ttyS0, ttyS1, ... on x86 (ttyAMA* on ARM64).
# hvc selects virtio consoles: hvc0, hvc1, ... in the guest.
# Available hardware serial ports depend on the QEMU machine.
# Sockets are named serial0.socket, serial1.socket, hvc0.socket,
# virtserialport0.socket, etc. Numbering includes stdio and PTY channels.
# Later channel IDs/logs use serial_console_1/virtio_console_1.
tty =
    serial socket
    hvc socket
    # virtserialport.0 is reserved for QGA in virtme/vmtest.
    virtserialport socket
    virtserialport socket

# Alternatives:
# tty =
#     serial stdio
#     serial socket
#     hvc stdio
#     virtserialport pty

# bg=1 runs QEMU in the background. A configured stdio backend remains stdio;
# only -d GDB mode moves it to the generated socket.
# console/hvc, SysRq and logs resolve the running backend through QMP.
# Shared stdio is logged to stdio.log; serial/hvc SysRq rejects a shared mux.
bg = 1
