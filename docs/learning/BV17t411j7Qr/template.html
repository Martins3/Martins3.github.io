<div class="bar"><strong>羽毛球 / 基础精要</strong><label><input id="search" type="search" aria-label="搜索正文" placeholder="搜索动作、战术或问题"></label><span id="results" role="status" aria-live="polite"></span><span class="spacer"></span><a href="README.md">Markdown 原文</a><button id="toggle" aria-expanded="true">收起画面</button></div>

<script>
/* MARKDOWN_SOURCE */
const $=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=url=>/^(https?:\/\/|(?:\.\.?\/)+|assets\/|#)/i.test(url)&&!/[\s<>"']/.test(url)?url:'#';
const media=[];
const defaultOnline=location.protocol!=='file:';
const playback=document.createElement('select');playback.id='playback';playback.setAttribute('aria-label','所有视频的播放来源');playback.innerHTML='<option value="local">本地视频</option><option value="bilibili">B 站视频</option>';playback.value=defaultOnline?'bilibili':'local';
const playbackLabel=document.createElement('label');playbackLabel.textContent='播放来源 ';playbackLabel.append(playback);document.querySelector('.bar .spacer').before(playbackLabel);
function sourceReference(m){
 const bvid=m.url.match(/\/(BV[\w]+)\//)?.[1],part=Number(m.url.match(/\/p(\d+)\//)?.[1]||1);
 if(!bvid)return null;
 const frame=m.url.match(/\/frames\/(\d+)\.jpg$/),time=m.type==='clip'?m.start:frame?(Number(frame[1])-1)*10:0;
 return {part,time,page:`https://www.bilibili.com/video/${bvid}/?p=${part}&t=${time}`,player:`https://player.bilibili.com/player.html?bvid=${bvid}&p=${part}&t=${time}&autoplay=0&danmaku=0`};
}
const iframe=document.createElement('iframe');iframe.id='bili-player';iframe.title='B 站原片播放器';iframe.allow='fullscreen';iframe.allowFullscreen=true;iframe.hidden=true;iframe.style.cssText='width:100%;aspect-ratio:4/3;border:0';$('video').after(iframe);
const sourceLink=document.createElement('a');sourceLink.target='_blank';sourceLink.rel='noreferrer';sourceLink.textContent='B 站对应画面';$('original').after(sourceLink);
function playOnline(m){const ref=sourceReference(m);if(!ref)return;segment=null;$('video').pause();$('video').hidden=true;iframe.hidden=false;iframe.src=ref.player;$('replay').hidden=true;$('loop-label').hidden=true;$('hint').textContent=m.type==='clip'?`原片从 ${m.start} 秒开始；参考片段终点 ${m.end} 秒。`:'原片定位到截图附近。';}
playback.onchange=()=>{if(current>=0)showMedia(current);};
function inline(source){
 const tokens=[];
 let s=source.replace(/!?\[([^\]]*)\]\(([^)]+)\)|`([^`]+)`/g,(match,label,url,code)=>{
  let html;
  if(code!==undefined)html='<code>'+esc(code)+'</code>';
  else{url=safe(url);const clip=url.match(/\.mp4#t=(\d+(?:\.\d+)?),(\d+(?:\.\d+)?)$/i);const image=/\.(jpg|jpeg|png|webp)$/i.test(url);
   if(image||clip){const i=media.length;media.push({label,url,type:clip?'clip':'image',start:clip?Number(clip[1]):null,end:clip?Number(clip[2]):null});html=`<a class="media-link ${clip?'clip':''}" href="${esc(url)}" data-media="${i}">${esc(label)}</a>`;}
   else html=`<a href="${esc(url)}" ${/^https?:/.test(url)?'target="_blank" rel="noreferrer"':''}>${esc(label)}</a>`;
  }
  tokens.push(html);return '\u0000'+(tokens.length-1)+'\u0000';
 });
 s=esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
 return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>tokens[Number(i)]);
}
function cells(line){return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(s=>s.trim());}
function renderMarkdown(source){
 const lines=source.replace(/\r/g,'').split('\n'),out=[],toc=[];let section=false;
 for(let i=0;i<lines.length;){const line=lines[i];if(!line.trim()||/^<!--/.test(line)){i++;continue;}
  if(/^```/.test(line)){const code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;out.push('<pre class="block"><code>'+esc(code.join('\n'))+'</code></pre>');continue;}
  const heading=line.match(/^(#{1,3})\s+(.+)$/);if(heading){const level=heading[1].length,part=heading[2].match(/^P(\d+)\s/),id=part?'part-'+part[1]:'section-'+i;if(level===2){if(section)out.push('</section>');out.push('<section>');section=true;toc.push({id,label:heading[2],topics:[]});}else if(level===3&&toc.length)toc[toc.length-1].topics.push({id,label:heading[2]});out.push(`<h${level} id="${id}">${inline(heading[2])}</h${level}>`);i++;continue;}
  if(line.trim().startsWith('|')&&i+1<lines.length&&/^\|?[\s:|-]+\|/.test(lines[i+1])){const header=cells(line);i+=2;const rows=[];while(i<lines.length&&lines[i].trim().startsWith('|'))rows.push(cells(lines[i++]));out.push('<div class="block table-wrap"><table><thead><tr>'+header.map(s=>'<th>'+inline(s)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(s=>'<td>'+inline(s)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;}
  if(/^\s*(- |\d+\. )/.test(line)){const ordered=/^\s*\d+\./.test(line),tag=ordered?'ol':'ul',items=[];while(i<lines.length&&/^\s*(- |\d+\. )/.test(lines[i]))items.push('<li>'+inline(lines[i++].replace(/^\s*(- |\d+\. )/,''))+'</li>');out.push('<'+tag+' class="block">'+items.join('')+'</'+tag+'>');continue;}
  if(/^> ?/.test(line)){const parts=[];while(i<lines.length&&/^> ?/.test(lines[i]))parts.push(lines[i++].replace(/^> ?/,''));out.push('<blockquote class="block">'+inline(parts.join(' '))+'</blockquote>');continue;}
  const parts=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,3}\s|\||```|> |\s*- |\s*\d+\. )/.test(lines[i]))parts.push(lines[i++]);out.push('<p class="block">'+inline(parts.join(' '))+'</p>');
 }
 if(section)out.push('</section>');return {html:out.join('\n'),toc};
}
const rendered=renderMarkdown(markdown);$('document').innerHTML=rendered.html;$('toc').innerHTML=rendered.toc.map(t=>t.topics.length?`<details><summary><a href="#${t.id}">${esc(t.label)}</a></summary><div class="topics">${t.topics.map(topic=>`<a href="#${topic.id}">${esc(topic.label)}</a>`).join('')}</div></details>`:`<a href="#${t.id}">${esc(t.label)}</a>`).join('');
$('toc').onclick=event=>{const group=event.target.closest('a')?.closest('details');if(group)group.open=true;};
let current=-1,segment=null;
function pane(open){$('layout').classList.toggle('text-only',!open);document.body.classList.toggle('pane-hidden',!open);$('toggle').textContent=open?'收起画面':'展开画面';$('toggle').setAttribute('aria-expanded',String(open));if(!open){$('video').pause();iframe.removeAttribute('src');}else if(!iframe.hidden&&!iframe.hasAttribute('src')&&current>=0)playOnline(media[current]);}
function showMedia(index,play=false){
 if(!media.length)return;current=(index+media.length)%media.length;const m=media[current];const v=$('video');v.pause();v.onloadedmetadata=null;segment=null;iframe.hidden=true;iframe.removeAttribute('src');pane(true);const ref=sourceReference(m);sourceLink.hidden=!ref;if(ref)sourceLink.href=ref.page;
 $('document').querySelectorAll('[data-media]').forEach(a=>a.classList.toggle('selected',Number(a.dataset.media)===current));
 const anchor=$('document').querySelector(`[data-media="${current}"]`),block=anchor?.closest('.block'),previous=block?.previousElementSibling;$('context').textContent=previous?.matches('p.block')&&!previous.querySelector('[data-media]')?previous.textContent:block?.textContent||'';
 $('media-title').textContent=m.label;const partId=m.url.match(/\/p(\d+)\//)?.[1];if(partId)$('part').value=partId;$('media-count').textContent=`${current+1} / ${media.length} 个画面入口`;$('original').href=m.url;
 $('original').textContent='打开原素材';$('picture').hidden=m.type!=='image';v.hidden=m.type!=='clip';$('replay').hidden=m.type!=='clip';$('loop-label').hidden=m.type!=='clip';
 if(m.type==='image'){$('picture').src=m.url;$('picture').alt=m.label;$('hint').textContent='';}
 else if(playback.value==='bilibili'&&ref){v.removeAttribute('src');v.load();$('original').href=ref.page;$('original').textContent='打开 B 站原片';playOnline(m);}
 else{segment={start:m.start,end:m.end};const src=m.url.split('#')[0];const seek=()=>{v.currentTime=m.start;if(play)v.play().catch(()=>{$('hint').textContent='请点击播放器的播放按钮。';});};if(v.getAttribute('src')!==src){v.onloadedmetadata=seek;v.src=src;v.load();}else if(v.readyState>=1)seek();else v.onloadedmetadata=seek;$('hint').textContent='';}
}
$('document').onclick=event=>{const a=event.target.closest('[data-media]');if(!a)return;event.preventDefault();showMedia(Number(a.dataset.media),true);};
$('video').ontimeupdate=()=>{const v=$('video');if(segment&&v.currentTime>=segment.end){if($('loop').checked)v.currentTime=segment.start;else{v.pause();segment=null;}}};
$('video').onerror=()=>{$('hint').textContent='未能读取视频，请确认 vn 与 vn-resources 保持同级。';};$('picture').onerror=()=>{$('hint').textContent='未能读取截图，请确认资源目录位置。';};
$('replay').onclick=()=>showMedia(current,true);$('previous').onclick=()=>showMedia(current-1);$('next').onclick=()=>showMedia(current+1);$('close').onclick=()=>pane(false);$('toggle').onclick=()=>pane($('layout').classList.contains('text-only'));
function zoom(){if($('picture').hidden)return;$('zoom-image').src=$('picture').src;$('zoom-image').alt=$('picture').alt;$('zoom').showModal();}
$('picture').onclick=zoom;$('picture').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoom();}};$('zoom-close').onclick=()=>$('zoom').close();
document.addEventListener('keydown',event=>{if(event.target.matches('input,textarea,select')||$('zoom').open)return;if(event.key==='Escape')pane(false);if(event.key==='[')showMedia(current-1);if(event.key===']')showMedia(current+1);});
$('search').oninput=()=>{
 const q=$('search').value.trim().toLowerCase(),blocks=Array.from($('document').querySelectorAll('.block')),groups=[];let count=0;
 blocks.forEach(block=>{block.hidden=!!q&&!block.textContent.toLowerCase().includes(q);if(!block.hidden)count++;});
 $('document').querySelectorAll('h3').forEach(heading=>{const nodes=[];for(let node=heading.nextElementSibling;node&&!node.matches('h2,h3');node=node.nextElementSibling)if(node.matches('.block'))nodes.push(node);groups.push({heading,nodes});if(q&&heading.textContent.toLowerCase().includes(q)){nodes.forEach(node=>node.hidden=false);count++;}});
 if(q)$('document').querySelectorAll('section').forEach(section=>{if(section.querySelector('h2').textContent.toLowerCase().includes(q)){section.querySelectorAll('.block').forEach(node=>node.hidden=false);count++;}});
 if(q)blocks.forEach(block=>{const previous=block.previousElementSibling;if(block.querySelector('[data-media]')&&previous?.matches('.block')&&!previous.hidden)block.hidden=false;});
 groups.forEach(({heading,nodes})=>heading.hidden=!!q&&!nodes.some(node=>!node.hidden));
 $('document').querySelectorAll('section').forEach(section=>{section.hidden=!!q&&!Array.from(section.querySelectorAll('.block')).some(b=>!b.hidden);if(q&&!section.hidden){const source=section.querySelector('.block');if(source?.querySelector('a[href*="bilibili.com"]'))source.hidden=false;}});
 $('toc').querySelectorAll('a').forEach(a=>{const heading=document.getElementById(a.hash.slice(1));a.hidden=heading?.hidden||heading?.closest('section')?.hidden||false;});$('results').textContent=q?`${count} 处匹配`:'';$('empty').hidden=count>0;
};
const fullParts=media.map((m,i)=>({...m,index:i})).filter(m=>m.type==='clip'&&m.start===0&&/P\d+.*完整/.test(m.label));
$('part').innerHTML=fullParts.map(m=>`<option value="${m.url.match(/\/p(\d+)\//)[1]}">${esc(m.label.replace(' · 完整原片',''))}</option>`).join('');
$('part').onchange=()=>{const m=fullParts.find(m=>m.url.includes('/p'+$('part').value+'/'));if(m)showMedia(m.index,true);};
if(media.length){current=media.findIndex(m=>m.type==='clip'&&m.start>0);if(current<0)current=0;$('media-title').textContent='选择正文中的片段';}pane(false);
</script>
