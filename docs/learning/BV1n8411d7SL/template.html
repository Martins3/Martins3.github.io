<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>饥荒开局 · 文字笔记</title>
<style>
:root{--paper:#f6f5f0;--ink:#26332d;--muted:#69746d;--line:#d9ded6;--accent:#285c46;--wash:#e6eee3;color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:68px}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}a{color:var(--accent);text-underline-offset:3px}button,input,select{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:4px;padding:3px 9px;color:var(--ink)}button:hover{background:var(--wash)}:focus-visible{outline:2px solid #64957a;outline-offset:3px}.bar{position:sticky;top:0;z-index:4;background:rgba(246,245,240,.97);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;gap:16px;align-items:center;font-size:13px}.bar strong{white-space:nowrap}.bar input{border:1px solid var(--line);background:white;padding:5px 9px;border-radius:4px;width:260px}.bar .spacer{flex:1}.layout{display:grid;grid-template-columns:174px minmax(0,1fr) 385px;gap:22px;max-width:1600px;margin:22px auto;padding:0 22px}.layout.text-only{grid-template-columns:174px minmax(0,1fr);max-width:1180px}.layout.text-only .media{display:none}.outline{position:sticky;top:74px;align-self:start;font-size:12px}.outline a{display:block;padding:6px 0;text-decoration:none;color:var(--muted);line-height:1.5}.outline a:hover{color:var(--accent)}.outline .caption{letter-spacing:2px;font-size:11px;margin-bottom:8px;color:var(--muted)}article{min-width:0}h1{font-size:25px;line-height:1.4;margin:0 0 12px}h2{font-size:18px;margin:25px 0 8px;padding-top:9px;border-top:1px solid var(--line)}h3{font-size:16px;margin:15px 0 6px}p{margin:8px 0 12px}ul,ol{padding-left:23px;margin:8px 0}li{margin:3px 0}strong{font-weight:650}.table-wrap{overflow:auto;margin:10px 0 14px}table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.55}th,td{padding:7px 9px;text-align:left;vertical-align:top;border:1px solid var(--line)}th{background:#e9ede4;font-weight:600}tr:nth-child(even) td{background:#f0f2eb}code{font:12px/1.6 ui-monospace,Consolas,monospace;background:#e9ece5;padding:2px 4px;border-radius:3px}pre{overflow:auto;background:#e9ece5;padding:12px}pre code{padding:0}blockquote{border-left:3px solid #9cab93;margin:10px 0;padding:1px 12px;color:var(--muted)}.media-link{font-size:12px;display:inline-block;text-decoration:none;border-bottom:1px dashed #7d9b89;padding:0 3px;white-space:normal;color:var(--accent)}.media-link::before{font-size:10px;content:'图 ';color:var(--muted)}.media-link.clip::before{content:'片段 '}.media-link.selected{background:#dbe9d7;outline:1px solid #97b690;border-radius:2px}.media{position:sticky;top:74px;align-self:start;border-left:1px solid var(--line);padding-left:18px}.media-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:10px}.media-head strong{font-size:13px}.media-head small{color:var(--muted)}#picture{width:100%;display:block;border-radius:3px;cursor:zoom-in}#video{width:100%;background:#16201a;border-radius:3px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;margin:10px 0}.controls label{display:flex;gap:4px;align-items:center}.media p{font-size:12px;color:var(--muted);margin:10px 0}.context{font-size:12px;background:#edf0e7;border-left:2px solid #a0b398;padding:9px;max-height:190px;overflow:auto;line-height:1.7}.footer{font-size:12px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:10px}#results{font-size:12px;color:var(--muted)}[hidden]{display:none!important}dialog{max-width:95vw;max-height:95vh;padding:12px;border:1px solid var(--line);background:var(--paper)}dialog::backdrop{background:#15211ccc}dialog img{max-width:90vw;max-height:83vh;display:block}dialog button{float:right;margin-bottom:8px}.empty{padding:20px;color:var(--muted)}@media(min-width:1450px){.layout{grid-template-columns:185px minmax(0,1fr) 440px}}@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 340px}.outline{display:none}.layout.text-only{grid-template-columns:1fr}}@media(max-width:760px){.bar{flex-wrap:wrap;gap:7px;padding:8px 12px}.bar input{width:190px}.bar .spacer{display:none}.layout,.layout.text-only{display:block;padding:0 14px;margin-top:16px}.media{position:fixed;z-index:5;bottom:0;top:auto;left:0;right:0;background:var(--paper);padding:12px;border:1px solid var(--line);max-height:65vh;overflow:auto;box-shadow:0 -4px 30px #17251a22}.media .context{max-height:65px}#picture,#video{max-height:35vh;object-fit:contain}body:not(.pane-hidden) article{padding-bottom:65vh}h1{font-size:22px}}
</style>
<div class="bar"><strong>饥荒 / 开局笔记</strong><label><input id="search" type="search" aria-label="搜索正文" placeholder="搜索材料、机制或问题"></label><span id="results" role="status" aria-live="polite"></span><span class="spacer"></span><a href="README.md">Markdown 原文</a><button id="toggle" aria-expanded="true">收起画面</button></div>
<div class="layout" id="layout">
 <nav class="outline" aria-label="正文目录"><div class="caption">阅读目录</div><div id="toc"></div></nav>
 <article><div id="document"></div><p id="empty" class="empty" hidden>没有匹配内容。</p></article>
 <aside class="media" id="media" aria-label="原片画面"><div class="media-head"><div><strong id="media-title">原片画面</strong><br><small id="media-count"></small></div><button id="close" aria-label="收起画面">收起</button></div><img id="picture" alt="" hidden tabindex="0" role="button" aria-label="放大截图"><video id="video" controls preload="metadata" hidden></video><div class="controls"><button id="previous" aria-label="上一张图或片段">上一处</button><button id="next" aria-label="下一张图或片段">下一处</button><button id="replay" hidden>重播片段</button><label id="loop-label" hidden><input type="checkbox" id="loop">循环</label><a id="original" target="_blank" rel="noreferrer">打开原素材</a></div><div id="context" class="context"></div><p id="hint" role="status"></p></aside>
</div>
<dialog id="zoom"><button id="zoom-close">关闭</button><img id="zoom-image" alt="放大的原片截图"></dialog>
<script>
/* MARKDOWN_SOURCE */
const $=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=url=>/^(https?:\/\/|(?:\.\.?\/)+|#)/i.test(url)&&!/[\s<>"']/.test(url)?url:'#';
const media=[];
function inline(source){
 const tokens=[];
 let s=source.replace(/!?\[([^\]]*)\]\(([^)]+)\)|`([^`]+)`/g,(match,label,url,code)=>{
  let html;
  if(code!==undefined)html='<code>'+esc(code)+'</code>';
  else{url=safe(url);const clip=url.match(/\.mp4#t=(\d+(?:\.\d+)?),(\d+(?:\.\d+)?)$/i);const image=/\.(jpg|jpeg|png|webp)$/i.test(url);
   if(image||clip){const i=media.length;media.push({label,url,type:clip?'clip':'image',start:clip?Number(clip[1]):null,end:clip?Number(clip[2]):null});html=`<a class="media-link ${clip?'clip':''}" href="${esc(url)}" data-media="${i}">${esc(label)}</a>`;}
   else html=`<a href="${esc(url)}" ${/^https?:/.test(url)?'target="_blank" rel="noreferrer"':''}>${esc(label)}</a>`;
  }
  tokens.push(html);return '\u0000'+(tokens.length-1)+'\u0000';
 });
 s=esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
 return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>tokens[Number(i)]);
}
function cells(line){return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(s=>s.trim());}
function renderMarkdown(source){
 const lines=source.replace(/\r/g,'').split('\n'),out=[],toc=[];let section=false;
 for(let i=0;i<lines.length;){const line=lines[i];if(!line.trim()||/^<!--/.test(line)){i++;continue;}
  if(/^```/.test(line)){const code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;out.push('<pre class="block"><code>'+esc(code.join('\n'))+'</code></pre>');continue;}
  const heading=line.match(/^(#{1,3})\s+(.+)$/);if(heading){const level=heading[1].length,id='section-'+i;if(level===2){if(section)out.push('</section>');out.push('<section>');section=true;toc.push({id,label:heading[2]});}out.push(`<h${level} id="${id}">${inline(heading[2])}</h${level}>`);i++;continue;}
  if(line.trim().startsWith('|')&&i+1<lines.length&&/^\|?[\s:|-]+\|/.test(lines[i+1])){const header=cells(line);i+=2;const rows=[];while(i<lines.length&&lines[i].trim().startsWith('|'))rows.push(cells(lines[i++]));out.push('<div class="block table-wrap"><table><thead><tr>'+header.map(s=>'<th>'+inline(s)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(s=>'<td>'+inline(s)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;}
  if(/^\s*(- |\d+\. )/.test(line)){const ordered=/^\s*\d+\./.test(line),tag=ordered?'ol':'ul',items=[];while(i<lines.length&&/^\s*(- |\d+\. )/.test(lines[i]))items.push('<li>'+inline(lines[i++].replace(/^\s*(- |\d+\. )/,''))+'</li>');out.push('<'+tag+' class="block">'+items.join('')+'</'+tag+'>');continue;}
  if(/^> ?/.test(line)){const parts=[];while(i<lines.length&&/^> ?/.test(lines[i]))parts.push(lines[i++].replace(/^> ?/,''));out.push('<blockquote class="block">'+inline(parts.join(' '))+'</blockquote>');continue;}
  const parts=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,3}\s|\||```|> |\s*- |\s*\d+\. )/.test(lines[i]))parts.push(lines[i++]);out.push('<p class="block">'+inline(parts.join(' '))+'</p>');
 }
 if(section)out.push('</section>');return {html:out.join('\n'),toc};
}
const rendered=renderMarkdown(markdown);$('document').innerHTML=rendered.html;$('toc').innerHTML=rendered.toc.map(t=>`<a href="#${t.id}">${esc(t.label)}</a>`).join('');
let current=-1,segment=null;
function pane(open){$('layout').classList.toggle('text-only',!open);document.body.classList.toggle('pane-hidden',!open);$('toggle').textContent=open?'收起画面':'展开画面';$('toggle').setAttribute('aria-expanded',String(open));if(!open)$('video').pause();}
function showMedia(index,play=false){
 if(!media.length)return;current=(index+media.length)%media.length;const m=media[current];pane(true);const v=$('video');v.pause();segment=null;
 $('document').querySelectorAll('[data-media]').forEach(a=>a.classList.toggle('selected',Number(a.dataset.media)===current));
 const anchor=$('document').querySelector(`[data-media="${current}"]`);$('context').textContent=anchor?.closest('.block')?.textContent||'';
 $('media-title').textContent=m.label;$('media-count').textContent=`${current+1} / ${media.length} 个画面入口`;$('original').href=m.url;
 $('picture').hidden=m.type!=='image';v.hidden=m.type!=='clip';$('replay').hidden=m.type!=='clip';$('loop-label').hidden=m.type!=='clip';
 if(m.type==='image'){$('picture').src=m.url;$('picture').alt=m.label;$('hint').textContent='';}
 else{segment={start:m.start,end:m.end};const src=m.url.split('#')[0];const seek=()=>{v.currentTime=m.start;if(play)v.play().catch(()=>{$('hint').textContent='请点击播放器的播放按钮。';});};if(v.getAttribute('src')!==src){v.onloadedmetadata=seek;v.src=src;v.load();}else if(v.readyState>=1)seek();else v.onloadedmetadata=seek;$('hint').textContent='';}
}
$('document').onclick=event=>{const a=event.target.closest('[data-media]');if(!a)return;event.preventDefault();showMedia(Number(a.dataset.media),true);};
$('video').ontimeupdate=()=>{const v=$('video');if(segment&&v.currentTime>=segment.end){if($('loop').checked)v.currentTime=segment.start;else{v.pause();segment=null;}}};
$('video').onerror=()=>{$('hint').textContent='未能读取视频，请确认 vn 与 vn-resources 保持同级。';};$('picture').onerror=()=>{$('hint').textContent='未能读取截图，请确认资源目录位置。';};
$('replay').onclick=()=>showMedia(current,true);$('previous').onclick=()=>showMedia(current-1);$('next').onclick=()=>showMedia(current+1);$('close').onclick=()=>pane(false);$('toggle').onclick=()=>pane($('layout').classList.contains('text-only'));
function zoom(){if($('picture').hidden)return;$('zoom-image').src=$('picture').src;$('zoom-image').alt=$('picture').alt;$('zoom').showModal();}
$('picture').onclick=zoom;$('picture').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoom();}};$('zoom-close').onclick=()=>$('zoom').close();
document.addEventListener('keydown',event=>{if(event.target.matches('input,textarea,select')||$('zoom').open)return;if(event.key==='Escape')pane(false);if(event.key==='[')showMedia(current-1);if(event.key===']')showMedia(current+1);});
$('search').oninput=()=>{const q=$('search').value.trim().toLowerCase();let count=0;$('document').querySelectorAll('.block').forEach(block=>{block.hidden=!!q&&!block.textContent.toLowerCase().includes(q);if(!block.hidden)count++;});$('document').querySelectorAll('section').forEach(section=>{section.hidden=!!q&&!Array.from(section.querySelectorAll('.block')).some(b=>!b.hidden);});$('toc').querySelectorAll('a').forEach(a=>{const heading=document.getElementById(a.hash.slice(1));a.hidden=heading?.closest('section')?.hidden||false;});$('results').textContent=q?`${count} 段匹配`:'';$('empty').hidden=count>0;};
if(media.length)showMedia(0);if(matchMedia('(max-width:760px)').matches)pane(false);
</script>
</html>
