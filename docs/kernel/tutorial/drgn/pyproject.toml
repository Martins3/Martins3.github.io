[tool.ruff]
line-length = 120

[tool.ruff.lint]
# drgn scripts are executed by the drgn launcher, which injects `prog`, and many
# helpers are intentionally best-effort probes against kernel objects.
per-file-ignores = { "*.py" = ["E722", "F401", "F541", "F821", "F841"] }

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-reference = "ignore"
unresolved-global = "ignore"

